name: Publish and deploy to Pi

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  # Same self-hosted runner already on the Pi (~/actions-runner).
  # Operates on the real home-dir checkout, like actual-helpers.
  deploy-pi:
    needs: publish-docker-image
    runs-on: self-hosted
    steps:
      - name: Pull and recreate Sweepy
        working-directory: /home/cassandrameijers/sweepy
        run: |
          set -euo pipefail
          git pull --ff-only
          docker compose pull
          docker compose up -d
          docker image prune -f
          docker ps --filter name=sweepy --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
