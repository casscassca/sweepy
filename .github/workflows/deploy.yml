name: Deploy to Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      COMPOSE_PROJECT_NAME: sweepy-clone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and restart Sweepy
        run: |
          docker compose up --build -d sweepy
