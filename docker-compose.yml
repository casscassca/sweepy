name: sweepy

services:
  sweepy:
    container_name: sweepy
    image: ghcr.io/casscassca/sweepy:latest
    build: .
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SWEEPY_PORT:-3000}:3000"
    volumes:
      - sweepy-data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      TZ: ${TZ:-America/Chicago}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
    restart: unless-stopped

volumes:
  sweepy-data:
